name: Unzip Project

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          if [ ! -f "wheres-my-stuff.zip" ]; then
            echo "wheres-my-stuff.zip not found at repo root."
            exit 1
          fi
          unzip -o wheres-my-stuff.zip -d extracted-tmp

      - name: Move extracted files to repo root
        run: |
          cp -a extracted-tmp/wheres-my-stuff/. .
          rm -rf extracted-tmp
          rm -f wheres-my-stuff.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project from zip" || echo "Nothing to commit"
          git push
