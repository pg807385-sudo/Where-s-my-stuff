name: Build and Sync Capacitor Mobile App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Web App and Sync Android Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm install @capacitor/filesystem @capacitor/local-notifications

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Native Projects
        run: npx cap sync
        
