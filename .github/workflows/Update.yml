name: Bootstrap Project

# One-time setup for a brand-new repo: extracts wheres-my-stuff.zip (uploaded
# to the repo root) and commits its full contents as the project. Run once,
# then delete this workflow — build-apk.yml handles everything after that.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          if [ ! -f "wheres-my-stuff.zip" ]; then
            echo "wheres-my-stuff.zip not found at repo root. Upload it first, then re-run this workflow."
            exit 1
          fi
          rm -rf extracted-tmp
          unzip -o wheres-my-stuff.zip -d extracted-tmp

      - name: Move project files to repo root
        run: |
          cp -a extracted-tmp/wheres-my-stuff/. .
          rm -rf extracted-tmp
          rm -f wheres-my-stuff.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap: add full Where's My Stuff? project" || echo "Nothing to commit"
          git push
