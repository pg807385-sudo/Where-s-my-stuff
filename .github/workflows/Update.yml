name: Update Project

# Extracts wheres-my-stuff.zip (uploaded to the repo root) and commits its
# contents into the repo, overwriting any files that changed. Run manually
# from the Actions tab whenever you upload a fresh zip with updates.
on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          if [ ! -f "wheres-my-stuff.zip" ]; then
            echo "wheres-my-stuff.zip not found at repo root. Upload it first, then re-run this workflow."
            exit 1
          fi
          rm -rf extracted-tmp
          unzip -o wheres-my-stuff.zip -d extracted-tmp

      - name: Move project files to repo root
        run: |
          cp -a extracted-tmp/wheres-my-stuff/. .
          rm -rf extracted-tmp
          rm -f wheres-my-stuff.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update project files" || echo "Nothing to commit"
          git push
