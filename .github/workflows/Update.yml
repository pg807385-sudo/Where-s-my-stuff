name: Sync Project (Clean)

# Makes the repo an EXACT mirror of wheres-my-stuff.zip — deletes any file
# in the repo that isn't in the zip, so stray/leftover files from previous
# partial updates get cleaned up too. Excludes public/ so your own
# logo.png/favicon (which aren't part of this zip) are never touched.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Unzip project archive
        run: |
          if [ ! -f "wheres-my-stuff.zip" ]; then
            echo "wheres-my-stuff.zip not found at repo root. Upload it first, then re-run this workflow."
            exit 1
          fi
          rm -rf extracted-tmp
          unzip -o wheres-my-stuff.zip -d extracted-tmp

      - name: Mirror extracted files into repo root (deletes stray files, keeps public/)
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='public/' \
            --exclude='.github/workflows/Update.yml' \
            --exclude='.github/workflows/sync-project.yml' \
            extracted-tmp/wheres-my-stuff/ .
          rm -rf extracted-tmp
          rm -f wheres-my-stuff.zip

      - name: Commit clean project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean sync: mirror project exactly, remove stray files" || echo "Nothing to commit"
          git push
