name: Build and Sync Capacitor Mobile App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Web App and Sync Android Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Compatible Capacitor 6 Plugins & Sync
        run: |
          npm install @capacitor/filesystem@^6.0.0 @capacitor/local-notifications@^6.0.0 --legacy-peer-deps
          npx cap sync

      - name: Build Web Production Bundle
        run: npm run build
        
